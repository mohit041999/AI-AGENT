            - paragraph [ref=e465]: capture, transcribe, and summarize
            - text: . First, you capture content by recording audio with a single tap on your phone, smartwatch, or computer, uploading a file, or pasting a YouTube or website URL into the app. You can also record phone calls and have them summarized. The app continues recording in the background, so you can pause, resume, and multitask freely. Second, SummarizeX uses
            - paragraph [ref=e466]: AI-powered speech recognition
            - text: to transcribe the audio into accurate text, supporting over 120 languages and multiple accents. Third, the AI analyzes the full transcript and generates a structured summary based on the format you choose — key points, detailed notes, lecture notes, or action items. After summarization, you can use the built-in
            - paragraph [ref=e467]: chat feature
            - text: to ask questions directly from the transcription, diving deeper into specific parts of the content. All summaries are organized in custom folders and are searchable within the app across all your devices.
